# The paper's L_total (Eq. 10) minus the discordant term:
#     L_s + lambda_m * (L_mm + lambda_v * L_v)
# This is the recipe to compare against `nllpch` on the same task head.
# SCALE WARNING: L_PCH is a log-likelihood (~0.8 on METABRIC) while MMV is a squared
# error in TIME units (~2400 on METABRIC, where durations run to ~355). Under `fixed`
# balancing the MMV term outweighs the likelihood by ~3 orders of magnitude and the
# likelihood is effectively ignored. `scale` normalises each component by its running
# magnitude, which is what makes this combination meaningful. Switch back to
# `balancing: default` (fixed) only if you set the coeffs to compensate by hand.
defaults:
  - balancing: scale

survival:
  _target_: sat.loss.MetaLoss
  losses:
    - _target_: sat.loss.SATNLLPCHazardLoss
      importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
      num_events: ${data.num_events}
    - _target_: sat.loss.MMVLoss
      duration_cuts: ${data.label_transform.save_dir}/duration_cuts.csv
      training_set: ${data.label_transform.save_dir}/transformed_train_labels.csv
      importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
      num_events: ${data.num_events}
      max_time: ${survival_max_time}
      variance_weight: ${mmv_variance_weight}
  coeffs:
    - ${likelihood_loss_coeff}
    - ${mmv_loss_coeff}
  balance_strategy: ${tasks.losses.balancing.balance_strategy}
  balance_params: ${tasks.losses.balancing.balance_params}
