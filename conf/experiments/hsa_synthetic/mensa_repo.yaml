# @package _global_
# MENSA on the 2-event dataset, as released by the authors (github.com/thecml/mensa). This is the setting MENSA is designed for
# and where its trajectory term (Eq. 8) is meaningful - set mensa_traj_lambda > 0
# and mensa_trajectories to a genuinely known ordering.
dataset: hsa_synthetic
modelname: mensa_repo

defaults:
  - hsa_synthetic/defaults
  - override /data/load: hsa_synthetic
  - override /data/parse: ${data/load}
  - override /data/transform: default
  - override /tokenizers: hsa_synthetic
  - override /transformers: numeric_bert
  - override /tasks: mensa-paper-survival
  - override /tasks/metrics: survtrace_within
  - override /trainer: hsa_synthetic/default

mensa_trajectory_time: reference
mensa_paper_scale_init: -1.0
