# @package _global_


label_transform_scheme: equidistant
label_transform_cuts: 4

one_calibration_bins: 10

likelihood_loss_coeff: 0.5

event_ranking_loss_coeff: 0.1
event_ranking_loss_sigma: 0.1
event_ranking_loss_margin: 0.05

ranking_loss_coeff: 0.2
ranking_loss_sigma: 0.1
ranking_loss_margin: 0.05


# Time at which S(t) is taken to reach 0 when integrating for the mean lifetime.
# null -> fall back to the largest duration cut. Datasets may override.
survival_max_time: null

# Multi-event metrics: score each event at the quantiles of its OWN observed times
# (true) instead of the pooled duration cuts (false = SurvTRACE protocol).
per_event_horizons: false

# Margin-Mean-Variance loss (UniSurv, arXiv:2409.06209)
mmv_loss_coeff: 1.0        # lambda_m in Eq. 10
mmv_variance_weight: 0.01  # lambda_v in Eq. 10; paper grids {0.001, 0.01, 0.1, 1}

# End-to-end LLM (paper §3, python -m sat.llm): answer = one token per duration cut
llm_model: distilgpt2          # HF hub name (tokenizer always; weights if pretrained)
llm_init: pretrained           # pretrained | scratch
llm_epochs: 30
llm_learning_rate: 5.0e-5      # use ~5e-4 for scratch
llm_batch_size: 32
llm_patience: 3                # epochs without validation improvement
llm_max_prompt_tokens: 768
llm_scratch_layers: 4
llm_scratch_hidden: 128
llm_scratch_heads: 4
llm_scratch_vocab: 2000        # BPE fitted on the training records (scratch only)

# ---------------------------------------------------------------------------
# Baseline models (NOT part of the paper's method - used only for comparison
# tables. See SCOPE.md.)
# ---------------------------------------------------------------------------

# DeepHit
calibration_loss_coeff: 0.2
deephit_alpha: 1.0            # alpha_k in Lee et al. Eq. 4 (weight on the ranking term L2)

# DSM - Deep Survival Machines
dsm_intermediate_size: 64
dsm_num_hidden_layers: 1
dsm_num_mixtures: 4
dsm_distribution: weibull
dsm_temp: 1000.0
dsm_discount: 1.0
dsm_bias: true
dsm_batch_norm: true
dsm_hidden_dropout_prob: 0.2
dsm_elbo: true

# DSM as published (Nagpal et al., IEEE JBHI 2021) - a BASELINE, not our method.
# Log-space SELU + learnable base parameterisation, exactly as auton-survival.
dsm_paper_num_mixtures: 4
dsm_paper_intermediate_size: 64
dsm_paper_temp: 1000.0        # DSM's own default; the gate is deliberately smoothed
dsm_paper_discount: 1.0       # alpha on the censored log-survival term
dsm_paper_elbo: true          # reference default for the main training phase
dsm_paper_dropout: 0.0
dsm_paper_scale_init: null    # null = from the data; -1.0 = reference default
dsm_paper_pretrain: true      # DSM fits base shape/scale on the durations before training

# MENSA as published (arXiv:2409.06525, ML4H 2025) - a BASELINE, not our method.
# Its trajectory term is prior work closely related to our L_mul, so it is the most
# relevant competitor rather than a generic baseline. See SCOPE.md.
mensa_paper_num_mixtures: 4      # paper searches Psi in {1,3,5,7}
mensa_paper_intermediate_size: 64
mensa_paper_temp: 1.0            # reference default; NOT DSM's 1000 (that flattens the gate)
mensa_paper_dropout: 0.0
mensa_paper_scale_init: null
mensa_paper_pretrain: false   # not in MENSA's released code; on = borrow DSM's pretraining
mensa_traj_lambda: 0.0           # lambda in Eq. 9; 0 = pure Eq. 7 likelihood
mensa_trajectories: []           # known orderings [[A, B], ...], 0-indexed
mensa_trajectory_time: paper     # "paper" = Eq. 8 S_B(T_A); "reference" = released code S_B(T_B)

# MENSA - Multi-Event Neural Survival Analysis
mensa_intermediate_size: 64
mensa_num_hidden_layers: 1
mensa_num_mixtures: 4
mensa_distribution: weibull
mensa_temp: 1000.0
mensa_discount: 1.0
mensa_bias: true
mensa_batch_norm: true
mensa_hidden_dropout_prob: 0.2
mensa_elbo: true
mensa_event_distribution: true
mensa_dependency_regularization: 0.01

loss_balancing_scale_alpha: 0.9
loss_balancing_scale_eps: 1.0e-8
loss_balancing_grad_alpha: 0.9
loss_balancing_grad_eps: 1.0e-8
loss_balancing_uncertainty_sigma: 1.0
loss_balancing_adaptive_alpha: 0.9
loss_balancing_adaptive_eps: 1.0e-8
loss_balancing_adaptive_window_size: 100
loss_balancing_adaptive_adaptation_rate: 0.005


# autograd anomaly detection is a debugging aid; it slows every step by ~40%.
# Turn on with detect_anomalies=true when chasing NaNs.
detect_anomalies: false

brier_per_horizon: false
nllpch_per_event: false
l1_per_event: false
mse_per_event: false
ce_per_event: false

learning_rate: 0.0001
weight_decay: 0.01
token_emb: 2
sentence_emb: 2

mtl_initializer_range: 0.02
mtl_initializer: kaiming_normal

transformer_layer_norm: false
# must be >= the trained tokenizer's vocabulary (raise it for real ICD-code data)
transformer_vocab_size: 1000
transformer_initializer_range: 0.01
transformer_hidden_size: 24
transformer_intermediate_size: 96
transformer_num_attention_heads: 4
transformer_num_hidden_layers: 2

survival_initializer_range: 0.02
survival_initializer: kaiming_normal
survival_shared_intermediate_size: 4
survival_shared_num_hidden_layers: 0
survival_batch_norm: false
survival_hidden_dropout_prob: false
survival_bias: true
survival_num_hidden_layers: 1
survival_loss_weight: 1.0

classification_initializer_range: 0.02
classification_initializer: xavier_normal
classification_shared_intermediate_size: 4
classification_shared_num_hidden_layers: 0
classification_event_time_thr: 0.5 # not tuned yet
classification_intermediate_size: 64
classification_batch_norm: false
classification_hidden_dropout_prob: false
classification_bias: true
classification_num_hidden_layers: 0
classification_loss_weight: 1.0

regression_initializer_range: 0.02
regression_initializer: kaiming_normal
regression_shared_intermediate_size: 4
regression_shared_num_hidden_layers: 0
regression_intermediate_size: 32
regression_batch_norm: false
regression_hidden_dropout_prob: false
regression_bias: true
regression_num_hidden_layers: 0
regression_num_labels: 1
regression_loss_weight: 1.0

# ---------------------------------------------------------------- version 2
# Checkpoint selection on the validation split. Survival-head models: C_td (higher is
# better). Regression-only models: the regression head's MAE-margin (lower is better).
selection_metric: eval_ctd_weighted_avg
selection_greater: true

# Loss recipe (sat/loss/factory.py, tasks/losses=v2): a term is used when its weight > 0.
v2_rank_coeff: 0.0          # L_rank (Eq. 4)
v2_rank_sigma: 0.1
v2_mul_coeff: 0.0           # L_mul (Eq. 5), needs >= 2 events
v2_mul_sigma: 0.1
v2_mmv_coeff: 0.0           # MMV (UniSurv reference, not in the paper)
v2_mmv_variance_weight: 0.01
v2_l1_type: margin          # regression head L_MAE: uncensored | margin (best guess, Eq. 6)
v2_mm_coeff: 0.0            # L_MM (Eq. 7), needs >= 2 events
v2_mm_t_q: observed         # t_q of an unobserved event: observed (Eq. 1) | best_guess (Eq. 6)
# time unit of the regression head (predicts v2_time_scale * softplus(z)), of L_MAE / L_MM
# and of MMV: by default the end of follow-up (last duration cut), so these losses sit on
# the scale of the likelihood. Override with 1.0 to work in raw time units.
v2_time_scale: ${cuts_max:${data.label_transform.save_dir}/duration_cuts.csv}

# Baselines (python -m sat.baselines baseline=<cox|rsf|deepsurv|pchazard>); the values
# here are only starting points - version 2 grid-searches them on validation.
baseline: cox
bl_cox_alpha: 0.01
bl_rsf_n_estimators: 200
bl_rsf_min_samples_leaf: 10
bl_rsf_max_features: sqrt
bl_nn_nodes: 32
bl_nn_layers: 2
bl_nn_dropout: 0.1
bl_nn_batch_norm: true
bl_nn_lr: 0.001
bl_nn_batch: 256
bl_nn_epochs: 200
bl_nn_patience: 10

# Official SurvTRACE (python -m sat.survtrace_official); defaults = its released STConfig,
# tuned in version 2 on the same grid as our model
st_hidden_size: 16
st_intermediate_size: 64
st_num_hidden_layers: 3
st_num_attention_heads: 2
st_hidden_dropout_prob: 0.0
st_early_stop_patience: 5
st_learning_rate: 0.001
st_weight_decay: 0.0001
st_batch_size: 64
st_epochs: 100

# LLM (paper Sec. 3), version 2 options
llm_loss: ce                 # ce (Eq. 8) | deephit (the paper's DeepHit-style likelihood)
llm_illegal_coeff: 0.0       # > 0: penalty on tokens after [C] (paper: illegal sequences)
llm_lora_r: 0                # > 0: LoRA adapters of rank r (e.g. for Qwen/Qwen2.5-0.5B)
llm_grad_accum: 1
llm_max_steps: -1           # > 0 only for smoke tests
