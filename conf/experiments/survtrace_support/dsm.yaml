# @package _global_
# SurvTRACE-comparable dsm baseline.
dataset: support_numeric
modelname: survtrace_dsm

defaults:
  - survtrace_support/defaults
  - override /data/load: support_numeric
  - override /data/parse: ${data/load}
  - override /tokenizers: support_numeric
  - override /transformers: numeric_bert
  - override /tasks: dsm-survival
  - override /tasks/metrics: survtrace
  - override /trainer: survtrace/default
