# @package _global_
# Longitudinal EHR (paper §4.2): same model/optimiser as the multievent group; the
# input is a coded, time-stamped history instead of a feature vector.
defaults:
  - ../defaults

ehr_source: ???       # data/<ehr_source>/{patients,events}.csv
ehr_repr: sequence    # sequence | bag | static
ehr_max_tokens: 256   # most recent tokens kept (static + history)
dataset: ${ehr_source}_${ehr_repr}
me_num_events: ???
me_num_features: ???

# Events on different time scales: score each at its own quantiles and give the
# piecewise-constant hazard head a finer grid than SurvTRACE's 4 intervals.
per_event_horizons: true
label_transform_cuts: 10

learning_rate: 0.01
warmup_steps: 40
weight_decay: 0.1

select_hidden_layers: null

sentence_emb: 3
token_emb: 2
dropout: 0.1

classification_event_time_thr: 0.5

transformer_layer_norm: true
transformer_hidden_size: 16
transformer_num_hidden_layers: 2
transformer_num_attention_heads: 4
transformer_intermediate_size: 16
transformer_attention_probs_dropout_prob: ${dropout}
transformer_hidden_probs_dropout: ${dropout}

shared_intermediate_size: 64
shared_batch_norm: true
shared_hidden_dropout_prob: 0.05
shared_bias: true
shared_num_hidden_layers: 0
shared_num_labels: 8

survival_intermediate_size: 16
survival_batch_norm: false
survival_hidden_dropout_prob: false
survival_bias: true
survival_num_hidden_layers: 0
survival_loss_weight: 1.0
survival_shared_intermediate_size: 32
survival_shared_num_hidden_layers: 0

# Select the checkpoint on the SurvTRACE-protocol C_td, not on the legacy
# ipcw_weighted_avg (no tau truncation, IPCW fitted on the evaluated split).
tasks:
  eval_metric: ${selection_metric}
  eval_metric_greater_is_better: ${selection_greater}  # set with the metric: task files differ
