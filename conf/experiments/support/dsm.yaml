# @package _global_
# Baseline model - not part of the paper's method. See SCOPE.md.
dataset: support
modelname: dsm

defaults:
  - support/defaults
  - override /data/load: support
  - override /data/parse: ${data/load}
  - override /tokenizers: support
  - override /transformers: bert
  - override /tasks: dsm-survival
  - override /trainer: support/default

survival_loss_weight: 1.0
